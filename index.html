  <style>
    :root { color-scheme:dark; background:#07070a; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-width:280px; min-height:100%; }
    body { overflow-x:hidden; background:#07070a; color:#f6f5f3; }
    .scene { position:relative; isolation:isolate; display:grid; place-items:center; min-height:100svh; overflow:hidden; }
    .atmosphere,.vignette { position:absolute; inset:0; pointer-events:none; }
    .atmosphere { z-index:-3; overflow:hidden; background:linear-gradient(145deg,#090c15 0%,#07070a 48%,#100910 100%); animation:background-in 2.6s ease-out both; }
    .light { position:absolute; top:49%; left:-20%; width:140%; height:1px; transform:rotate(-13deg); background:linear-gradient(90deg,transparent 10%,#448cda24 30%,#9a96e095 49%,#b6649770 64%,transparent 87%); box-shadow:0 0 7px 1px #725aa426; }
    .light::before { content:""; position:absolute; inset:-15px 10%; background:radial-gradient(ellipse at center,#8876ce24,transparent 70%); opacity:.4; animation:light-breathe 2.7s ease-in-out infinite; }
    .light-glint { position:absolute; left:calc(50% - clamp(79.2px,11.44vw,167.2px)); top:-.5px; width:clamp(158.4px,22.88vw,334.4px); height:2px; opacity:.65; animation:light-arrive 5.5s 1.5s cubic-bezier(.25,.1,.25,1) both; }
    .light-spark { display:block; position:absolute; inset:0; background:linear-gradient(90deg,transparent 0%,#9c93df28 18%,#9c93df55 32%,#d4eaffcc 46%,#ffffff 50%,#d4eaffcc 54%,#9c93df55 68%,#9c93df28 82%,transparent 100%); }
    .scene:has(.status:hover) .light-spark { filter:brightness(1.25); }
    .light-spark { transition:filter .6s ease; }
    .light-spark::after { content:""; position:absolute; left:50%; top:50%; width:56px; height:24px; transform:translate(-50%,-50%); background:radial-gradient(ellipse,#d1e7ff80 0%,#a89aff28 22%,transparent 68%); }
    .dust-point { position:absolute; left:var(--x); top:var(--y); width:2px; height:2px; border-radius:50%; background:#b9c9e4; opacity:.45; will-change:transform,opacity; animation:point-drift var(--duration) var(--delay) ease-in-out infinite alternate; }
    .dust-point:nth-of-type(3n) { width:1px; height:1px; background:#d6adcc; }
    .vignette { z-index:2; background:radial-gradient(ellipse at 50% 47%,transparent 45%,#03030650 100%); }
    .identity { width:min(52vw,740px); display:flex; flex-direction:column; align-items:center; margin:0; padding:56px 0 64px; position:relative; z-index:1; transform:translateY(-1.5vh); perspective:none; }
    .mark { position:relative; display:block; width:100%; aspect-ratio:2; padding:0; border:0; background:none; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; transform-style:flat; isolation:isolate; outline:none; opacity:0; }
    .mark:focus-visible { outline:1px solid #9c84bd; outline-offset:26px; }
    .mark::before { content:""; position:absolute; z-index:0; inset:-10% -8%; background:radial-gradient(ellipse at 50% 54%,#55377524,transparent 62%); opacity:var(--energy,.2); pointer-events:none; }
    .logo { z-index:1; pointer-events:none; transform-origin:50% 50%; display:block; position:relative; width:100%; height:100%; overflow:visible; }
    .shard { transform-origin:0 0; }
    .face { fill:#efedf3; stroke:#eeeaf1; stroke-width:.25; stroke-linejoin:round; }
    .echo { opacity:0; pointer-events:none; }
    .cyan { fill:#39dcff; }
    .pink { fill:#f13983; }
    .intro-trail { fill:none; stroke:#b3baf9; stroke-width:1; opacity:0; pointer-events:none; }
    .cast-shadow { fill:#000008; opacity:.5; }
    .reflection { fill:url(#reflection); opacity:0; pointer-events:none; }
    .rim { fill:none; stroke:url(#edge-light); stroke-width:.9; stroke-linejoin:round; opacity:.2; pointer-events:none; }
    .status { position:relative; margin:clamp(56px,8vh,90px) 0 0; padding-left:.48em; font:400 .75rem/1.8 Arial,Helvetica,sans-serif; letter-spacing:.48em; color:#d2cdda; white-space:nowrap; animation:appear 2.2s 1.5s ease-out both; }
    .status-text { display:inline-block; }
    .loading-letter { display:inline-block; opacity:.48; animation:letter-wave 2.7s calc(var(--i)*.12s) ease-in-out infinite; }
    .word-gap { display:inline-block; width:.7em; }
    .horizon { position:absolute; bottom:0; height:1px; width:46%; left:27%; background:linear-gradient(90deg,transparent,#6a538452,#83536036,transparent); }
    @keyframes appear { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
    @keyframes background-in { from { opacity:0; } to { opacity:1; } }
    @keyframes light-breathe { 0%,54%,100% { opacity:.3; } 24% { opacity:.45; } }
    @keyframes light-arrive { from { transform:translate3d(-18vw,0,0); opacity:0; } to { transform:translate3d(0,0,0); opacity:.65; } }
    @keyframes point-drift { from { transform:translate3d(0,0,0); opacity:.25; } to { transform:translate3d(var(--dx),var(--dy),0); opacity:.7; } }
    @keyframes letter-wave { 0%,54%,100% { opacity:.45; transform:translateY(0); } 24% { opacity:1; transform:translateY(-2px); } }
    @media (max-width:700px) { .identity { width:76vw; transform:translateY(-2vh); } .status { margin-top:64px; letter-spacing:.38em; padding-left:.38em; } }
    @media (max-height:480px) and (orientation:landscape) { .identity { width:min(48vw,460px); padding:32px 0; transform:none; } .status { margin-top:38px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } .mark { opacity:1; } .loading-letter { opacity:.85; } .light-glint { display:none; } .dust-point { opacity:.4; } }
</style><noscript><style>.mark{opacity:1}</style></noscript>

se class="reflection" href="#piece23"/><use class="rim" href="#piece23"/></g><g class="shard"><use class="intro-trail" href="#piece24"/><use class="cast-shadow" href="#piece24"/><use class="echo cyan" href="#piece24"/><use class="echo pink" href="#piece24"/><use class="face" href="#piece24"/><use class="reflection" href="#piece24"/><use class="rim" href="#piece24"/></g><g class="shard"><use class="intro-trail" href="#piece25"/><use class="cast-shadow" href="#piece25"/><use class="echo cyan" href="#piece25"/><use class="echo pink" href="#piece25"/><use class="face" href="#piece25"/><use class="reflection" href="#piece25"/><use class="rim" href="#piece25"/></g><g class="shard"><use class="intro-trail" href="#piece26"/><use class="cast-shadow" href="#piece26"/><use class="echo cyan" href="#piece26"/><use class="echo pink" href="#piece26"/><use class="face" href="#piece26"/><use class="reflection" href="#piece26"/><use class="rim" href="#piece26"/></g><g class="shard"><use class="intro-trail" href="#piece27"/><use class="cast-shadow" href="#piece27"/><use class="echo cyan" href="#piece27"/><use class="echo pink" href="#piece27"/><use class="face" href="#piece27"/><use class="reflection" href="#piece27"/><use class="rim" href="#piece27"/></g><g class="shard"><use class="intro-trail" href="#piece28"/><use class="cast-shadow" href="#piece28"/><use class="echo cyan" href="#piece28"/><use class="echo pink" href="#piece28"/><use class="face" href="#piece28"/><use class="reflection" href="#piece28"/><use class="rim" href="#piece28"/></g><g class="shard"><use class="intro-trail" href="#piece29"/><use class="cast-shadow" href="#piece29"/><use class="echo cyan" href="#piece29"/><use class="echo pink" href="#piece29"/><use class="face" href="#piece29"/><use class="reflection" href="#piece29"/><use class="rim" href="#piece29"/></g></svg></button>
      <h1 class="status" aria-label="COMING SOON"><span class="status-text" aria-hidden="true"><span class="loading-letter" style="--i:0">C</span><span class="loading-letter" style="--i:1">O</span><span class="loading-letter" style="--i:2">M</span><span class="loading-letter" style="--i:3">I</span><span class="loading-letter" style="--i:4">N</span><span class="loading-letter" style="--i:5">G</span><span class="word-gap"> </span><span class="loading-letter" style="--i:7">S</span><span class="loading-letter" style="--i:8">O</span><span class="loading-letter" style="--i:9">O</span><span class="loading-letter" style="--i:10">N</span></span></h1>
    </div>

    <div class="horizon" aria-hidden="true"></div>
  </main>
  <script>const mark = document.querySelector('.mark');
const svg = document.querySelector('.logo');
const reflection = document.querySelector('#reflection');
const motion = matchMedia('(prefers-reduced-motion: reduce)');
const scene = document.querySelector('.scene');
const backgroundLight = document.querySelector('.light');
function alignBackgroundLight() {
  const bounds = mark.getBoundingClientRect();
  const origin = scene.getBoundingClientRect();
  // SVG gap spans y=690..750 in viewBox y=330..870; its center is y=720.
  const centerX = bounds.left - origin.left + bounds.width / 2;
  const centerY = bounds.top - origin.top + bounds.height * (720 - 330) / 540;
  backgroundLight.style.left = `calc(${centerX}px - 70%)`;
  backgroundLight.style.top = `${centerY - .5}px`;
}
alignBackgroundLight();
const lightLayoutObserver = new ResizeObserver(alignBackgroundLight);
lightLayoutObserver.observe(mark);
lightLayoutObserver.observe(scene);
window.addEventListener('resize', alignBackgroundLight, {passive:true});
const shards = [...document.querySelectorAll('.shard')].map((node, i) => {
  const b = node.getBBox();
  return {node, x:b.x+b.width/2, y:b.y+b.height/2, bounds:b, appearAt:.2+((i*11)%30)/29*1.0, assembleAt:4.6+((i*17+7)%30)/29*4, kickX:0, kickY:0, moveVX:0, moveVY:0, clickEnergy:0, scalePulse:0, scaleVelocity:0, phase:i*2.39996,
    cyan:node.querySelector('.cyan'), pink:node.querySelector('.pink'),
    face:node.querySelector('.face'), shadow:node.querySelector('.cast-shadow'),
    rim:node.querySelector('.rim'), reflection:node.querySelector('.reflection'), trail:node.querySelector('.intro-trail'), seed:(i*.61803398875)%1};
});
const INTRO_END=Math.max(...shards.map(s=>s.assembleAt))+.15;
const smooth = value => { const x=Math.max(0,Math.min(1,value)); return x*x*(3-2*x); };
let frame=0, previous=0, time=0, hovering=false, strength=0;
let targetX=0, targetY=0, mouseX=0, mouseY=0;
let impulses=[];

function reset() {
  mark.style.transform='none'; svg.style.transform='none'; mark.style.opacity=1; impulses=[];
  mark.style.setProperty('--energy','.12');
  for(const s of shards) {
    s.kickX=0; s.kickY=0; s.moveVX=0; s.moveVY=0; s.clickEnergy=0; s.scalePulse=0; s.scaleVelocity=0; s.node.removeAttribute('transform'); s.node.style.filter='none'; s.node.style.opacity=1; s.trail.style.opacity=0;
    s.cyan.style.opacity=0; s.pink.style.opacity=0; s.reflection.style.opacity=0;
    s.face.style.fill=''; s.shadow.style.opacity=.24;
    s.shadow.setAttribute('transform','translate(5 8)'); s.rim.style.opacity=.12;
  }
}


// Signed translation springs let fragments cross their resting position on reunion.
function reunionSpring(position, velocity, goal, dt) {
  const frequency=14, damping=.44, rate=frequency*damping;
  const wave=frequency*Math.sqrt(1-damping*damping);
  const offset=position-goal, decay=Math.exp(-rate*dt);
  const cosine=Math.cos(wave*dt), sine=Math.sin(wave*dt);
  const next=goal+decay*(offset*cosine+(velocity+rate*offset)/wave*sine);
  const speed=decay*(velocity*cosine-(rate*velocity+frequency*frequency*offset)/wave*sine);
  return Math.abs(next-goal)<.001&&Math.abs(speed)<.01 ? [goal,0] : [next,speed];
}

function render(now) {
  frame=0;
  if(document.hidden) { previous=0; return; }
  if(motion.matches) { reset(); return; }
  const dt=previous ? Math.min((now-previous)/1000,.05) : 1/60;
  previous=now; time+=dt;
  const follow=1-Math.exp(-dt*9), release=1-Math.exp(-dt*7);
  mouseX+=(targetX-mouseX)*follow; mouseY+=(targetY-mouseY)*follow;
  strength+=((hovering?1:0)-strength)*release;
  if(!hovering && strength<.001) strength=0;
  const pointerX=600+mouseX*540, pointerY=600+mouseY*270;
  const intro=1-smooth((time-.8)/(INTRO_END-.8));
  svg.style.transform=`perspective(1000px) rotateX(${-mouseY*4*strength-intro*7}deg) rotateY(${mouseX*5*strength+intro*5}deg) scale(${1-intro*.035})`;
  mark.style.opacity=smooth((time-.1)/2).toFixed(4);

  reflection.setAttribute('gradientTransform',`translate(${pointerX.toFixed(2)} ${(pointerY-335).toFixed(2)})`);
  impulses=impulses.filter(impulse=>time-impulse.started<1.3);
  let clickSettling=false;
  let energy=intro*.6;
  for(const s of shards) {
    // Staggered depth planes converge once; all envelopes reach exactly zero.
    if(time<s.appearAt) { s.node.style.opacity=0; continue; }
    const progress=smooth((time-s.appearAt)/(s.assembleAt-s.appearAt));
    const arrival=1-progress;
    const depth=arrival*(Math.sin(s.phase)*165+Math.cos(time*.85+s.phase)*55);
    const projection=880/(880-depth);
    const tumble=arrival*Math.sin(s.phase+time*.55);
    const focus=Math.min(4.8,Math.abs(depth)/43+arrival*(.4+s.seed*.8));
    s.node.style.filter=arrival>0?`blur(${focus.toFixed(3)}px)`:'none';
    s.node.style.opacity=smooth((time-s.appearAt)/(.95+s.seed*.45)).toFixed(4);
    const dx=s.x-pointerX, dy=s.y-pointerY;
    const distance=Math.hypot(dx,dy);
    // A bounded field: only fragments close to the pointer respond.
    const field=1-smooth(distance/330);
    const near=field*strength;
    const nx=dx/Math.hypot(distance,55);
    const ny=dy/Math.hypot(distance,55);
    let kickTargetX=0, kickTargetY=0, energyTarget=0, scaleTarget=0;
    for(const impulse of impulses) {
      // Bound influence to the actual fragment, not a wave across the whole wordmark.
      const edgeX=Math.max(s.bounds.x-impulse.x,0,impulse.x-s.bounds.x-s.bounds.width);
      const edgeY=Math.max(s.bounds.y-impulse.y,0,impulse.y-s.bounds.y-s.bounds.height);
      const edgeDistance=Math.hypot(edgeX,edgeY);
      if(edgeDistance>=210) continue;
      const hit=time-impulse.started-edgeDistance/1800;
      const envelope=smooth(hit/.10)*(1-smooth((hit-.12)/.92));
      const impact=envelope*(1-smooth(edgeDistance/210));
      const bx=s.x-impulse.x, by=s.y-impulse.y, bd=Math.hypot(bx,by);
      const ux=bd>8?bx/bd:Math.sin(s.phase+.75);
      const uy=bd>8?by/bd:-Math.cos(s.phase+.75);
      const moveEnvelope=smooth(hit/.10)*(1-smooth((hit-.18)/.38));
      const moveImpact=moveEnvelope*(1-smooth(edgeDistance/210));
      kickTargetX+=ux*moveImpact*52; kickTargetY+=uy*moveImpact*40;
      energyTarget+=impact;
      // Release the enlargement sooner; a local spring carries it through neutral.
      scaleTarget+=moveImpact;
    }
    // Continue the current displacement through rapid clicks instead of resetting it.
    const response=1-Math.exp(-dt*20);
    const hoverField=hovering?field:0;
    const moveGoalX=nx*hoverField*23+Math.max(-76,Math.min(76,kickTargetX));
    const moveGoalY=ny*hoverField*17+Math.max(-60,Math.min(60,kickTargetY));
    [s.kickX,s.moveVX]=reunionSpring(s.kickX,s.moveVX,moveGoalX,dt);
    [s.kickY,s.moveVY]=reunionSpring(s.kickY,s.moveVY,moveGoalY,dt);
    s.clickEnergy+=(Math.min(1.4,energyTarget)-s.clickEnergy)*response;
    if(s.clickEnergy<.0001&&energyTarget===0) s.clickEnergy=0;
    // Exact damped-spring integration preserves momentum on repeated clicks.
    const scaleGoal=Math.min(1.4,scaleTarget);
    const frequency=15, damping=.42, decayRate=frequency*damping;
    const oscillation=frequency*Math.sqrt(1-damping*damping);
    const offsetFromGoal=s.scalePulse-scaleGoal;
    const decay=Math.exp(-decayRate*dt), cosine=Math.cos(oscillation*dt), sine=Math.sin(oscillation*dt);
    const nextScale=scaleGoal+decay*(offsetFromGoal*cosine+(s.scaleVelocity+decayRate*offsetFromGoal)/oscillation*sine);
    s.scaleVelocity=decay*(s.scaleVelocity*cosine-(decayRate*s.scaleVelocity+frequency*frequency*offsetFromGoal)/oscillation*sine);
    s.scalePulse=nextScale;
    if(scaleGoal===0&&Math.abs(s.scalePulse)<.0002&&Math.abs(s.scaleVelocity)<.002) {
      s.scalePulse=0; s.scaleVelocity=0;
    }
    if(s.kickX!==0||s.kickY!==0||s.moveVX!==0||s.moveVY!==0||s.clickEnergy!==0||s.scalePulse!==0||s.scaleVelocity!==0) clickSettling=true;
    const pulse=s.clickEnergy;
    const local=near;
    const x=(s.x-600)*arrival*.32+Math.sin(time*.65+s.phase)*arrival*22+s.kickX;
    const y=(s.y-575)*arrival*.32-arrival*55*Math.sin(s.phase)+s.kickY;
    const angle=Math.sin(s.phase)*(local*2.6+pulse*4.2);
    s.node.setAttribute('transform',`translate(${x.toFixed(2)} ${y.toFixed(2)}) translate(${s.x} ${s.y}) rotate(${angle.toFixed(2)}) skewX(${(tumble*8).toFixed(2)}) scale(${(projection*(1-Math.abs(tumble)*.08)*(1+s.scalePulse*.055)).toFixed(5)} ${(projection*(1+s.scalePulse*.055)).toFixed(5)}) translate(${-s.x} ${-s.y})`);
    const introChroma=Math.pow(arrival,1.35);
    const offset=2+local*10+pulse*19+introChroma*(18+s.seed*17);
    const chromaY=offset*(.38+arrival*Math.sin(s.phase+time*.45)*.65);
    s.cyan.setAttribute('transform',`translate(${-offset} ${chromaY})`);
    s.pink.setAttribute('transform',`translate(${offset} ${-chromaY})`);
    s.cyan.style.opacity=Math.min(.96,local*.72+pulse*.9+introChroma*.66).toFixed(4);
    s.pink.style.opacity=Math.min(.96,local*.72+pulse*.9+introChroma*.66).toFixed(4);

    s.reflection.style.opacity=Math.min(1,near*.72+pulse*.78).toFixed(4);
    s.trail.setAttribute('transform',`translate(${(-tumble*16).toFixed(2)} ${(arrival*15).toFixed(2)})`);
    s.trail.style.opacity=(arrival*.27*smooth(time/1.6)).toFixed(4);
    const shade=(.5+.5*Math.sin(s.phase))*local*10+arrival*(10+s.seed*22);
    s.face.style.fill=`rgb(${Math.round(Math.min(255,237-shade-near*12+pulse*24))} ${Math.round(Math.min(255,236-shade-near*4+pulse*23))} ${Math.round(Math.min(255,242-shade+near*10+pulse*13))})`;
    s.shadow.setAttribute('transform',`translate(${(5+local*8-near*3+depth*.035+s.kickX*.15).toFixed(2)} ${(8+local*11+Math.abs(depth)*.09+pulse*12).toFixed(2)})`);
    s.shadow.style.opacity=Math.min(.7,.24+local*.2+arrival*.1+pulse*.25).toFixed(4);
    s.rim.style.opacity=Math.min(1,.12+local*.75+arrival*.55+pulse*.9).toFixed(4);
    energy=Math.max(energy,local*.85,pulse*.9);
  }
  mark.style.setProperty('--energy',Math.min(1,energy+.12).toFixed(3));
  if(time<INTRO_END || hovering || strength>0 || impulses.length>0 || clickSettling) frame=requestAnimationFrame(render);
  else previous=0;
}

function wake() {
  if(motion.matches || document.hidden || frame) return;
  previous=0; frame=requestAnimationFrame(render);
}
function locate(event) {
  // This button never tilts. Its visual child does not participate in hit testing.
  const r=mark.getBoundingClientRect();
  targetX=Math.max(-1,Math.min(1,(event.clientX-r.left)/r.width*2-1));
  targetY=Math.max(-1,Math.min(1,(event.clientY-r.top)/r.height*2-1));
}
function approach(event) {
  if(motion.matches || event.pointerType==='touch') return;
  locate(event); hovering=true; wake();
}
function leave() { hovering=false; wake(); }
mark.addEventListener('pointerenter',approach,{passive:true});
mark.addEventListener('pointermove',approach,{passive:true});
mark.addEventListener('pointerleave',leave);
mark.addEventListener('pointercancel',leave);
mark.addEventListener('pointerdown',event=>{
  if(motion.matches || event.pointerType!=='touch') return;
  locate(event); hovering=true; wake();
},{passive:true});
mark.addEventListener('pointerup',event=>{if(event.pointerType==='touch') leave();},{passive:true});
mark.addEventListener('click',event=>{
  if(motion.matches) return;
  let x=600,y=600;
  if(event.detail!==0) { locate(event); x=600+targetX*540; y=600+targetY*270; }
  impulses.push({x,y,started:time}); wake();
});
motion.addEventListener('change',()=>{
  cancelAnimationFrame(frame); frame=0; previous=0;
  if(motion.matches) { time=Math.max(time,INTRO_END); strength=0; hovering=false; reset(); }
  else wake();
});
document.addEventListener('visibilitychange',()=>{
  cancelAnimationFrame(frame); frame=0; previous=0; hovering=false;
  if(!document.hidden) wake();
});
if(motion.matches) { time=INTRO_END; reset(); } else wake();
</script>
